<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Smart Hospital System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a, #0284c7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            max-width: 480px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="register-card bg-white p-4 p-md-5 my-4">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-plus text-primary display-5 mb-2"></i>
            <h3 class="fw-bold mb-1">Create Account</h3>
            <p class="text-muted small">Palak Rawat (2419261) &bull; Process Sync & Auth</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
                        {{ msg }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required minlength="3" maxlength="50">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Role</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-id-badge"></i></span>
                    <select name="userRole" class="form-select" required>
                        <option value="Admin">Admin</option>
                        <option value="Doctor">Doctor</option>
                        <option value="Receptionist">Receptionist</option>
                        <option value="Patient" selected>Patient</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                <i class="fa-solid fa-check me-2"></i> Register Account
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="small fw-bold text-decoration-none ms-1">Login here</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
