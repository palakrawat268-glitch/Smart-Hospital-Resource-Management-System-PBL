{% extends "base.html" %}

{% block title %}{{ action }} Patient &bull; Smart Hospital System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-0">
                <h4 class="fw-bold mb-0">
                    <i class="fa-solid fa-hospital-user text-primary me-2"></i>{{ action }} Patient Record
                </h4>
                <p class="text-muted small mb-0">Module 2: Prasoon Joshi &bull; Process Control Block</p>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Patient Full Name</label>
                        <input type="text" name="patientName" class="form-control" placeholder="e.g. John Doe" value="{{ patient.patientName if patient else '' }}" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Process State / Status</label>
                        <select name="patientStatus" class="form-select">
                            <option value="Waiting" {% if patient and patient.patientStatus == 'Waiting' %}selected{% endif %}>Waiting (In Ready Queue)</option>
                            <option value="Admitted" {% if patient and patient.patientStatus == 'Admitted' %}selected{% endif %}>Admitted (Occupying Bed)</option>
                            <option value="Discharged" {% if patient and patient.patientStatus == 'Discharged' %}selected{% endif %}>Discharged (Deallocated)</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('patient.patient_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-bold">{{ action }} Patient</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
